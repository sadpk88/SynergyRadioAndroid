name: Build Synergy Radio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Installation de Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Générer l'APK Debug
        run: gradle assembleDebug --stacktrace

      - name: Télécharger l'APK compilé (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Synergy-Radio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
