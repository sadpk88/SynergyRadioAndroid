name: Build Synergy Radio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Autoriser le trafic HTTP clair dans le Manifest
        run: |
          MANIFEST_PATH="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ] && ! grep -q "usesCleartextTraffic" "$MANIFEST_PATH"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST_PATH"
          fi

      - name: Installation de Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Générer l'APK Debug
        run: gradle assembleDebug

      - name: Télécharger l'APK compilé (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Synergy-Radio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
