name: Build Synergy Radio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: S'assurer que le dossier assets existe
        run: mkdir -p app/src/main/assets

      - name: Préparation automatique de la configuration Gradle
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SynergyRadio"
          include ':app'
          EOF

      - name: Installation de Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Générer l'APK Debug
        run: gradle assembleDebug

      - name: Télécharger l'APK compilé (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Synergy-Radio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
