name: Build Synergy Radio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Vérification et placement automatique de index.html
        run: |
          mkdir -p app/src/main/assets
          # Si tu as mis un index.html ailleurs dans le dépôt, il le copie au bon endroit :
          FOUND_HTML=$(find . -name "index.html" -not -path "./app/src/main/assets/index.html" | head -n 1)
          if [ -n "$FOUND_HTML" ]; then
            cp "$FOUND_HTML" app/src/main/assets/index.html
          fi
          # Si aucun index.html n'existe encore, il génère le lecteur Synergy Radio complet :
          if [ ! -f "app/src/main/assets/index.html" ]; then
            cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>Synergy Radio</title>
              <style>
                  :root { --bg: #0b0b10; --card: #151520; --accent: #e50914; --gold: #ffb74d; --green: #00e676; --text: #fff; --sub: #9e9ea7; }
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
                  body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 14px; }
                  .shell { width: 100%; max-width: 400px; background: radial-gradient(circle at top, #25162b 0%, var(--card) 70%); border-radius: 28px; padding: 24px 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; overflow: hidden; }
                  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
                  .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.08); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--sub); }
                  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
                  .dot.active { background: var(--green); box-shadow: 0 0 10px var(--green); }
                  .show { font-size: 12px; color: var(--gold); font-weight: 600; }
                  .disc { width: 190px; height: 190px; margin: 0 auto 20px; border-radius: 50%; padding: 6px; background: linear-gradient(135deg, var(--accent), #ff8f00); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
                  .disc.playing { animation: spin 16s linear infinite; box-shadow: 0 0 30px rgba(229,9,20,0.5); }
                  @keyframes spin { 100% { transform: rotate(360deg); } }
                  .disc-in { width: 100%; height: 100%; border-radius: 50%; background: #101018; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 4px solid var(--card); }
                  .title { font-size: 24px; font-weight: 900; letter-spacing: 2px; color: #fff; }
                  .sub { font-size: 10px; letter-spacing: 3px; color: var(--gold); margin-top: 4px; }
                  .station { font-size: 21px; font-weight: 800; margin-bottom: 6px; }
                  .track { font-size: 13px; color: var(--sub); min-height: 20px; margin-bottom: 18px; padding: 0 8px; }
                  .btn-play { width: 72px; height: 72px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 26px; margin: 0 auto 16px; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 25px rgba(229,9,20,0.5); }
                  .vol { display: flex; align-items: center; gap: 10px; width: 80%; margin: 0 auto 22px; }
                  .vol input { flex: 1; accent-color: var(--accent); }
                  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
                  .btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #fff; padding: 12px 8px; border-radius: 14px; font-size: 13px; font-weight: 600; }
                  .btn-req { color: var(--green); border-color: rgba(0,230,118,0.3); }
                  .banner { background: rgba(0,0,0,0.35); border: 1px dashed rgba(255,255,255,0.15); border-radius: 12px; padding: 10px 12px; font-size: 11px; color: var(--sub); display: flex; justify-content: space-between; }
                  .modal { position: absolute; inset: 0; background: rgba(11,11,16,0.96); display: none; flex-direction: column; justify-content: center; padding: 22px; z-index: 10; }
                  .modal.open { display: flex; }
                  .inp { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 12px; color: #fff; margin-bottom: 10px; }
                  .sub-btn { width: 100%; background: var(--green); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 700; }
              </style>
          </head>
          <body>
              <div class="shell">
                  <div class="top">
                      <div class="badge"><span class="dot" id="dot"></span><span id="liveTxt">Hors ligne</span></div>
                      <div class="show" id="showTxt">Synergy Live</div>
                  </div>
                  <div class="disc" id="disc"><div class="disc-in"><div class="title">SYNERGY</div><div class="sub">217.77.6.151:8080</div></div></div>
                  <div class="station">Synergy Radio</div>
                  <div class="track" id="trackTxt">Appuyez sur Play pour écouter</div>
                  <button class="btn-play" id="playBtn">▶</button>
                  <div class="vol"><span>🔈</span><input type="range" id="vol" min="0" max="1" step="0.05" value="0.9"><span>🔊</span></div>
                  <div class="grid">
                      <button class="btn btn-req" onclick="document.getElementById('modal').classList.add('open')">🎵 Demande</button>
                      <button class="btn" onclick="document.getElementById('trackTxt').textContent='Merci pour votre soutien à Synergy Radio ❤️'">☕ Soutenir</button>
                  </div>
                  <div class="banner"><span>Communauté Synergy</span><span style="color:var(--gold);font-weight:700;">LIVE ★</span></div>
                  <div class="modal" id="modal">
                      <h3 style="margin-bottom:12px;">Demande Spéciale</h3>
                      <input class="inp" id="rName" placeholder="Votre pseudo">
                      <input class="inp" id="rSong" placeholder="Artiste & Titre souhaité">
                      <input class="inp" id="rMsg" placeholder="Dédicace (optionnel)">
                      <button class="sub-btn" onclick="sendReq()">Envoyer au Studio</button>
                      <button style="background:none;border:none;color:var(--sub);margin-top:14px;" onclick="document.getElementById('modal').classList.remove('open')">Fermer</button>
                  </div>
              </div>
