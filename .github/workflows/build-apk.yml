
name: Build Synergy Radio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SynergyRadioAndroid.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: unzip SynergyRadioAndroid.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: SynergyRadioAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SynergyRadio-debug-apk
          path: SynergyRadioAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
