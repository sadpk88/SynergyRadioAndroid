<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synergy Radio</title>
    <style>
        :root {
            --bg-dark: #0b0b10;
            --card-bg: #151520;
            --accent: #e50914;
            --accent-glow: rgba(229, 9, 20, 0.5);
            --gold: #ffb74d;
            --green: #00e676;
            --text-main: #ffffff;
            --text-sub: #9e9ea7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .app-shell {
            width: 100%;
            max-width: 400px;
            background: radial-gradient(circle at top, #23192d 0%, var(--card-bg) 70%);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.07);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-sub);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #666;
        }

        .live-dot.active {
            background-color: var(--green);
            box-shadow: 0 0 10px var(--green);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .program-tag {
            font-size: 12px;
            color: var(--gold);
            font-weight: 600;
        }

        .cover-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, var(--accent), #ff8f00);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .cover-wrapper.playing {
            box-shadow: 0 0 35px var(--accent-glow);
            animation: rotateCover 18s linear infinite;
        }

        @keyframes rotateCover {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .cover-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #101018;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 4px solid var(--card-bg);
        }

        .cover-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cover-sub {
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .track-info {
            margin-bottom: 18px;
        }

        .station-name {
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .now-playing {
            font-size: 13px;
            color: var(--text-sub);
            min-height: 20px;
            padding: 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .equalizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 4px;
            height: 20px;
            margin-bottom: 20px;
            opacity: 0.25;
        }

        .equalizer.active { opacity: 1; }

        .bar {
            width: 4px;
            height: 5px;
            background: var(--accent);
            border-radius: 2px;
        }

        .equalizer.active .bar {
            animation: eqBounce 0.7s infinite ease-in-out alternate;
        }
        .equalizer.active .bar:nth-child(1) { animation-delay: 0.1s; }
        .equalizer.active .bar:nth-child(2) { animation-delay: 0.3s; }
        .equalizer.active .bar:nth-child(3) { animation-delay: 0.0s; }
        .equalizer.active .bar:nth-child(4) { animation-delay: 0.4s; }
        .equalizer.active .bar:nth-child(5) { animation-delay: 0.2s; }

        @keyframes eqBounce {
            0% { height: 4px; }
            100% { height: 20px; }
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
        }

        .btn-play {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 8px 25px var(--accent-glow);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 80%;
            color: var(--text-sub);
            font-size: 14px;
        }

        .volume-slider {
            flex: 1;
            accent-color: var(--accent);
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px 10px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-request {
            color: var(--green);
            border-color: rgba(0, 230, 118, 0.25);
        }

        .sponsor-banner {
            background: rgba(0, 0, 0, 0.35);
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 11px;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sponsor-tag {
            background: rgba(229, 9, 20, 0.2);
            color: #ff6b6b;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .sponsor-link {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
        }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 11, 16, 0.96);
            display: none;
            flex-direction: column;
            justify-content: center;
            padding: 24px;
            z-index: 10;
        }

        .modal-overlay.open { display: flex; }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px;
            color: white;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            background: var(--green);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: var(--text-sub);
            margin-top: 14px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <div class="top-bar">
            <div class="live-badge">
                <span class="live-dot" id="liveDot"></span>
                <span id="liveText">Hors ligne</span>
            </div>
            <div class="program-tag" id="programTime">Synergy Live</div>
        </div>

        <div class="cover-wrapper" id="coverWrapper">
            <div class="cover-inner">
                <div class="cover-title">SYNERGY</div>
                <div class="cover-sub">PORT 8080</div>
            </div>
        </div>

        <div class="track-info">
            <div class="station-name">Synergy Radio</div>
            <div class="now-playing" id="statusText">Appuyez sur Play pour écouter</div>
        </div>

        <div class="equalizer" id="equalizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <div class="controls">
            <button class="btn-play" id="playBtn">▶</button>
            <div class="volume-box">
                <span>🔈</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="0.9">
                <span>🔊</span>
            </div>
        </div>

        <div class="action-grid">
            <button class="btn-action btn-request" id="openRequestBtn">🎵 Demande spéciale</button>
            <button class="btn-action" onclick="alert('Merci pour votre soutien à Synergy Radio ❤️')">☕ Soutenir</button>
        </div>

        <div class="sponsor-banner">
            <span class="sponsor-tag">Serveur</span>
            <span>Communauté Synergy Online</span>
            <a href="#" class="sponsor-link">LIVE ★</a>
        </div>

        <div class="modal-overlay" id="requestModal">
            <h3 style="margin-bottom: 6px;">Demande Spéciale</h3>
            <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 18px;">Envoyez votre demande directement à l'équipe Synergy</p>
            <form id="requestForm">
                <input type="text" id="reqName" class="form-input" placeholder="Votre pseudo" required>
                <input type="text" id="reqSong" class="form-input" placeholder="Artiste & Titre souhaité" required>
                <input type="text" id="reqMsg" class="form-input" placeholder="Dédicace (optionnel)">
                <button type="submit" class="btn-submit">Envoyer la demande</button>
            </form>
            <button class="btn-close" id="closeRequestBtn">Fermer</button>
        </div>
    </div>

    <audio id="audioPlayer" preload="none" crossorigin="anonymous"></audio>

    <script>
        const STREAM_URL = "http://217.77.6.151:8080/stream";

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const statusText = document.getElementById('statusText');
        const liveDot = document.getElementById('liveDot');
        const liveText = document.getElementById('liveText');
        const coverWrapper = document.getElementById('coverWrapper');
        const equalizer = document.getElementById('equalizer');
        const volumeSlider = document.getElementById('volumeSlider');
        const programTime = document.getElementById('programTime');

        let isPlaying = false;

        function updateShowTime() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 12) programTime.textContent = "☀️ Morning Vibes";
            else if (hour >= 12 && hour < 18) programTime.textContent = "⚡ Afternoon Mix";
            else if (hour >= 18 && hour < 23) programTime.textContent = "🔥 Evening Session";
            else programTime.textContent = "🌙 Night Chill";
        }
        updateShowTime();

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                statusText.textContent = "Connexion au serveur Fire...";
                audio.src = STREAM_URL + "?nocache=" + new Date().getTime();
                audio.volume = volumeSlider.value;
                audio.play().catch(() => {
                    statusText.textContent = "Erreur de lecture (Vérifiez l'AutoDJ)";
                });
            } else {
                audio.pause();
                audio.src = "";
                setStoppedState();
            }
        });

        audio.addEventListener('playing', () => {
            isPlaying = true;
            playBtn.textContent = "⏹";
            statusText.textContent = "En direct • Synergy Radio";
            liveDot.classList.add('active');
            liveText.textContent = "EN DIRECT";
            coverWrapper.classList.add('playing');
            equalizer.classList.add('active');
        });

        audio.addEventListener('error', () => {
            if (isPlaying) {
                statusText.textContent = "Flux coupé. Relancez la lecture.";
                setStoppedState();
            }
        });

        function setStoppedState() {
            isPlaying = false;
            playBtn.textContent = "▶";
            statusText.textContent = "Diffusion arrêtée";
            liveDot.classList.remove('active');
            liveText.textContent = "Hors ligne";
            coverWrapper.classList.remove('playing');
            equalizer.classList.remove('active');
        }

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        const requestModal = document.getElementById('requestModal');
        document.getElementById('openRequestBtn').addEventListener('click', () => requestModal.classList.add('open'));
        document.getElementById('closeRequestBtn').addEventListener('click', () => requestModal.classList.remove('open'));

        document.getElementById('requestForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const pseudo = document.getElementById('reqName').value;
            alert("Merci " + pseudo + " ! Votre demande a bien été transmise.");
            requestModal.classList.remove('open');
            e.target.reset();
        });
    </script>
</body>
</html>
